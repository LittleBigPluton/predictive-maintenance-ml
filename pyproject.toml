[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"


[project]
name = "predictive-maintenance-ml"
version = "1.0.0"
description = "An end-to-end supervised learning pipeline for machine failure prediction using the AI4I 2020 dataset."
requires-python = ">=3.12"

authors = [
    { name = "Ahmet Umut Gökdemir" }
]

dependencies = [
    "joblib>=1.3,<2",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "seaborn>=0.13,<1",
    "ucimlrepo>=0.0.7,<1",
    "xgboost>=2.0,<4",
]


[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29,<7",
    "jupyterlab>=4,<5",
]

dev = [
    "mypy>=1.10,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.5,<1",
]


[project.scripts]
predictive-maintenance = "predictive_maintenance.cli:main"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=predictive_maintenance",
    "--cov-report=term-missing",
]


[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]


[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I", "B", "UP"]


[tool.mypy]
python_version = "3.12"
files = ["src/predictive_maintenance"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
